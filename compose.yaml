services:
  coverly:
    image: coverly:${COVERLY_RELEASE:-current}
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3009:3000"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
